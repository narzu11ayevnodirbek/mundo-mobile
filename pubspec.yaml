name: mundo_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  glassmorphism: ^3.0.0
  go_router: ^17.1.0
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true

  image_path_android: "assets/logos/playstore.png"
  image_path_ios: "assets/logos/appstore.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logos/
    - assets/icons/search_icons/